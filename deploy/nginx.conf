# Nginx site config for the OpenBIS Oscilloscope service.
# Install to /etc/nginx/sites-available/openbis-oscilloscope and symlink to sites-enabled.
#
# URL layout (base path /oscilloscope/ from vite.config.ts):
#   /oscilloscope/        → Vite SPA static files
#   /oscilloscope/api/    → FastAPI backend on 127.0.0.1:8000 (prefix stripped)
#
# The frontend calls ${BASE_URL}api${path} which resolves to /oscilloscope/api/<path>.
# Nginx strips the /oscilloscope/api prefix so FastAPI sees plain /devices, /auth/me, etc.

server {
    listen 80;
    server_name _;

    # Serve the built Vite SPA
    root /opt/openbis-oscilloscope/frontend/dist;

    # SSE endpoint — must be proxied without buffering so events reach the browser immediately.
    location /oscilloscope/api/devices/events {
        proxy_pass         http://127.0.0.1:8000/devices/events;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 86400s;
        add_header         X-Accel-Buffering no;
    }

    # All other API requests — strip /oscilloscope/api prefix before forwarding.
    location /oscilloscope/api/ {
        proxy_pass         http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # SPA — unknown paths fall back to index.html so React Router handles routing.
    location /oscilloscope/ {
        try_files $uri $uri/ /oscilloscope/index.html;
    }

    # Convenience redirect from root to the app.
    location = / {
        return 301 /oscilloscope/;
    }
}
